<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pomodoro Tree</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>🌳 Pomodoro Tree</h1>

        <div class="layout">
            <!-- Columna izquierda: diario (sesiones) -->
            <section class="diario">
                <div class="streak-card" id="streak-card">
                    <span class="fire">🔥</span>
                    <span class="streak-number" id="streak">0</span>
                </div>
                <p class="streak-label">racha de días</p>

                <form id="session-form">
                    <div class="form-group">
                        <label for="date">Fecha</label>
                        <input type="date" id="date">
                    </div>
                    <div class="form-group">
                        <label for="topic">Tema / asignatura</label>
                        <input type="text" id="topic" placeholder="¿Qué estudiaste?" required>
                    </div>

                    <!-- Tiempo de estudio: horas y minutos mediante campos numéricos -->
                    <div class="form-group time-block">
                        <div class="time-row">
                            <label for="hours">Horas</label>
                            <input type="number" id="hours" min="0" max="12" step="1" value="0" inputmode="numeric">
                        </div>
                        <div class="time-row">
                            <label for="minutes">Minutos</label>
                            <input type="number" id="minutes" min="0" max="55" step="5" value="25" inputmode="numeric">
                        </div>
                        <p class="time-summary">Tiempo: <strong id="time-total">25 minutos</strong></p>
                    </div>

                    <label class="fixed-check">
                        <input type="checkbox" id="fixed">
                        <span>🔒 Fijar tiempo de estudio (no se podrá editar después)</span>
                    </label>

                    <button type="submit" class="btn-primary">Guardar sesión</button>
                </form>

                <h2>Sesiones</h2>
                <ul id="sessions-list"></ul>
            </section>

            <!-- Columna derecha: el árbol "Pomodoro Tree" -->
            <section class="tree-panel">
                <h2 class="tree-title">Mi Pomodoro Tree</h2>

                <div id="tree" class="tree stage-0 wilt-0" aria-label="Árbol que crece y puede marchitarse">
                    <svg class="tree-svg" viewBox="0 0 220 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-hidden="true">
                        <!-- suelo -->
                        <ellipse class="ground" cx="110" cy="270" rx="80" ry="16"/>

                        <!-- planta (grupo al que se le aplica el marchitado) -->
                        <g class="plant">
                            <!-- semilla -->
                            <g class="t-seed">
                                <ellipse cx="110" cy="262" rx="11" ry="13" fill="#6b5138"/>
                                <ellipse cx="106" cy="258" rx="3" ry="4" fill="#7d6449" opacity="0.7"/>
                            </g>

                            <!-- tallo flojo con flor -->
                            <g class="t-stem">
                                <path d="M110 264 C 104 240, 116 216, 110 194" fill="none" stroke="#3f7d4e" stroke-width="5" stroke-linecap="round"/>
                                <ellipse cx="95" cy="230" rx="13" ry="5" fill="#5c9e67" transform="rotate(-28 95 230)"/>
                                <ellipse cx="125" cy="210" rx="13" ry="5" fill="#5c9e67" transform="rotate(28 125 210)"/>
                                <circle cx="110" cy="190" r="8" fill="#f3c3d4"/>
                                <circle cx="110" cy="190" r="3.5" fill="#ffd966"/>
                            </g>

                            <!-- tronco -->
                            <g class="t-trunk">
                                <path d="M100 272 L 105 214 Q 110 204 115 214 L 120 272 Z" fill="#7a5a3a"/>
                            </g>

                            <!-- copa / follaje -->
                            <g class="t-crown">
                                <circle cx="110" cy="150" r="54" fill="#4f8f5a"/>
                                <circle cx="64" cy="170" r="32" fill="#5c9e67"/>
                                <circle cx="156" cy="170" r="32" fill="#5c9e67"/>
                                <circle cx="78" cy="130" r="30" fill="#69a973"/>
                                <circle cx="142" cy="130" r="30" fill="#69a973"/>
                                <circle cx="110" cy="115" r="34" fill="#6fae78"/>
                            </g>

                            <!-- tomates: el color (verde/rojo) se controla por CSS según el nivel -->
                            <g class="t-fruits">
                                <g><circle class="fruit" cx="86" cy="138" r="7"/><circle class="fruit-shine" cx="84" cy="135" r="2"/></g>
                                <g><circle class="fruit" cx="140" cy="152" r="7"/><circle class="fruit-shine" cx="138" cy="149" r="2"/></g>
                                <g><circle class="fruit" cx="110" cy="182" r="7"/><circle class="fruit-shine" cx="108" cy="179" r="2"/></g>
                                <g><circle class="fruit" cx="126" cy="120" r="6"/><circle class="fruit-shine" cx="124" cy="118" r="2"/></g>
                                <g><circle class="fruit" cx="94" cy="112" r="6"/><circle class="fruit-shine" cx="92" cy="110" r="2"/></g>
                                <g><circle class="fruit" cx="130" cy="176" r="6"/><circle class="fruit-shine" cx="128" cy="174" r="2"/></g>
                            </g>
                        </g>
                    </svg>
                </div>

                <p class="stage-name"><span id="stage-name">Semilla</span></p>
                <p class="wilt-name" id="wilt-name"></p>

                <!-- [DEBUG] Zona de pruebas para el marchitado (días simulados, solo visual) -->
                <div class="debug-controls">
                    <span class="debug-label">[DEBUG] Marchitado (días simulados)</span>
                    <button type="button" id="btn-wilt" class="btn-ghost">Día sin estudiar +1</button>
                    <button type="button" id="btn-revive" class="btn-primary">Quitar días simulados (revivir)</button>
                    <button type="button" id="btn-reset" class="btn-ghost">Reiniciar</button>
                </div>

                <!-- [DEBUG] Zona de pruebas para el fondo por franja horaria -->
                <div class="debug-controls">
                    <span class="debug-label">[DEBUG] Fondo (franja horaria)</span>
                    <select id="bg-hour" aria-label="Simular la hora local para el fondo"></select>
                </div>
            </section>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
